[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esophageal-motility-manometry-engine"
version = "2.0.0"
description = "ManometryMind: Chicago Classification v4.0 High-Resolution Esophageal Motility Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
esophageal-motility-manometry-engine = "esophageal_motility_manometry_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/esophageal-motility-manometry-engine"
Repository = "https://github.com/abusuraihsakhri/esophageal-motility-manometry-engine.git"
